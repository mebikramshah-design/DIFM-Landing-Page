name: CI

on:
  push:
    branches: ["claude/fm-lead-generation-62pb8", "main"]
  pull_request:
    branches: ["claude/fm-lead-generation-62pb8", "main"]

permissions:
  contents: read

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
